<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rekapinyu - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4" id="auth-container">
<!-- CARD LOGIN -->
<div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl border border-slate-100 transition-all" id="login-card">
<div class="text-center mb-6 login-brand-header">
<img alt="REKAPINYU" class="login-brand-logo" src="https://github.com/rekapinyu/rekapinyu.github.io/blob/main/Galery/LogoRekpinyuBiru.jpg?raw=true"/>
<p class="login-brand-tagline">Kelola Keuangan Anda Dengan Mudah</p>
</div>
<form class="space-y-4" id="login-form">
<div>
<label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Nomor HP</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
<i class="fa-solid fa-phone"></i>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 text-sm font-semibold transition" id="login-phone" inputmode="numeric" pattern="[0-9]*" placeholder="" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Kata Sandi</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
<i class="fa-solid fa-lock"></i>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 text-sm font-semibold transition" id="login-password" placeholder="" required="" type="password"/>
</div>
</div>
<button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl shadow-sm shadow-emerald-200 text-sm" type="submit">
                    Masuk ke Aplikasi
                </button>
</form>
<div class="mt-6 text-center text-xs text-slate-500">
                Belum punya akun? <button class="text-emerald-600 font-bold hover:underline" onclick="toggleAuthView('register')">Daftar di sini</button>
</div>
</div>
<!-- CARD REGISTER -->
<div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl border border-slate-100 hidden transition-all" id="register-card">
<div class="text-center mb-6 login-brand-header">
<img alt="REKAPINYU" class="login-brand-logo" src="https://github.com/rekapinyu/rekapinyu.github.io/blob/main/Galery/LogoRekpinyuBiru.jpg?raw=true"/>
<p class="login-brand-tagline">Kelola Keuangan Anda Dengan Mudah</p>
</div>
<form class="space-y-4" id="register-form">
<div>
<label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Nama Toko</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
<i class="fa-solid fa-user"></i>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 text-sm font-semibold transition" id="reg-name" placeholder="Nama Toko Anda" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Nomor HP</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
<i class="fa-solid fa-phone"></i>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 text-sm font-semibold transition" id="reg-phone" inputmode="numeric" pattern="[0-9]*" placeholder="" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Kata Sandi</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
<i class="fa-solid fa-lock"></i>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 text-sm font-semibold transition" id="reg-password" placeholder="" required="" type="password"/>
</div>
</div>
<button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl shadow-sm shadow-emerald-200 text-sm" type="submit">
                    Daftar Sekarang
                </button>
</form>
<div class="mt-6 text-center text-xs text-slate-500">
                Sudah punya akun? <button class="text-emerald-600 font-bold hover:underline" onclick="toggleAuthView('login')">Masuk</button>
</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAyzAV68m4BRtwmn0iu2vDplZaJ9r_uQVk",authDomain:"rekapinyu.firebaseapp.com",projectId:"rekapinyu",storageBucket:"rekapinyu.firebasestorage.app",messagingSenderId:"835450919713",appId:"1:835450919713:web:818f9f48c5b05330d67c60",measurementId:"G-4KSJC9ENH8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const phoneOf=v=>String(v??"").replace(/\D/g,"");
const emailOf=p=>`${phoneOf(p)}@rekapinyu.app`;
const sessionKey="finance_active_session";
const goApp=()=>window.location.replace("https://rekapinyu.github.io/aplikasi");
const show=(title,msg)=>window.alert(`${title}\n\n${msg}`);

function toggleAuthView(view){
 const l=document.getElementById("login-card"),r=document.getElementById("register-card");
 if(view==="register"){l?.classList.add("hidden");r?.classList.remove("hidden")}
 else{r?.classList.add("hidden");l?.classList.remove("hidden")}
}
window.toggleAuthView=toggleAuthView;

function saveSession(u){
 const data={uid:u.uid,name:u.name||"",shopName:u.shopName||"",phone:phoneOf(u.phone),email:u.email||"",password:u.password||"",role:u.role||"Pengguna"};
 localStorage.setItem(sessionKey,JSON.stringify(data));
}
async function loadProfile(user,p,password){
 try{const snap=await getDoc(doc(db,"Pengguna",user.uid));const d=snap.exists()?snap.data()||{}:{};return {uid:user.uid,name:String(d.NamaPengguna||user.displayName||""),shopName:String(d.NamaToko||d.shopName||d.storeName||d.tokoName||""),phone:phoneOf(d.NomorHp||p),email:user.email||"",password:String(d.Pasword||password),role:d.role||"Pengguna"};}
 catch(_){return {uid:user.uid,name:user.displayName||"",shopName:"",phone:p,email:user.email||"",password,role:"Pengguna"};}
}
async function ensureBase(user,p,name,password){
 const pr=doc(db,"Pengguna",user.uid),kr=doc(db,"Kasir",user.uid),rr=doc(db,"Rekap",user.uid);
 const [ps,ks,rs]=await Promise.all([getDoc(pr),getDoc(kr),getDoc(rr)]);
 if(!ps.exists())await setDoc(pr,{NamaPengguna:name,NomorHp:p,Pasword:password,role:"Pengguna"},{merge:true});
 if(!ks.exists())await setDoc(kr,{Aktifitas:[],NamaToko:name,NomorHp:p,Seting:{}},{merge:true});
 if(!rs.exists())await setDoc(rr,{BackupOtomatis:[],History:[],InputData:[],Kasbon:[],LaporanBulanan:[],NamaToko:name,NomorHp:p,Pengeluaran:[]},{merge:true});
}

document.getElementById("login-form")?.addEventListener("submit",async e=>{
 e.preventDefault();const btn=e.submitter;if(btn)btn.disabled=true;
 try{await setPersistence(auth,browserLocalPersistence);const p=phoneOf(document.getElementById("login-phone")?.value||""),password=document.getElementById("login-password")?.value||"";if(!p||!password){show("Gagal Masuk","Nomor HP dan Kata Sandi wajib diisi.");return}const c=await signInWithEmailAndPassword(auth,emailOf(p),password);const d=await loadProfile(c.user,p,password);saveSession(d);goApp();}
 catch(err){const c=err?.code||"";show("Gagal Masuk",c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"?"Nomor HP atau Kata Sandi yang Anda masukkan salah.":c==="auth/network-request-failed"?"Koneksi ke Firebase gagal. Periksa internet lalu coba lagi.":"Login gagal. Periksa nomor HP, kata sandi, dan koneksi Firebase.");}
 finally{if(btn)btn.disabled=false}
});

document.getElementById("register-form")?.addEventListener("submit",async e=>{
 e.preventDefault();const btn=e.submitter;if(btn)btn.disabled=true;
 try{await setPersistence(auth,browserLocalPersistence);const name=document.getElementById("reg-name")?.value.trim()||"",p=phoneOf(document.getElementById("reg-phone")?.value||""),password=document.getElementById("reg-password")?.value||"";if(!name||!p||password.length<6){show("Gagal Daftar",!name?"Nama wajib diisi.":!p?"Nomor HP wajib diisi.":"Kata sandi minimal 6 karakter.");return}const c=await createUserWithEmailAndPassword(auth,emailOf(p),password);await updateProfile(c.user,{displayName:name});await ensureBase(c.user,p,name,password);await auth.signOut();e.target.reset();toggleAuthView("login");show("Pendaftaran Berhasil","Akun berhasil dibuat. Silakan masuk menggunakan Nomor HP dan Kata Sandi.");}
 catch(err){const c=err?.code||"";show("Gagal Daftar",c==="auth/email-already-in-use"?"Nomor HP tersebut sudah terdaftar. Silakan langsung masuk.":c==="auth/weak-password"?"Kata sandi terlalu lemah. Gunakan minimal 6 karakter.":c==="auth/network-request-failed"?"Koneksi ke Firebase gagal. Periksa internet lalu coba lagi.":"Pendaftaran gagal. Periksa koneksi Firebase.");}
 finally{if(btn)btn.disabled=false}
});
</script>
</body></html>
