<style id="rekapinyu-session-gate">
  html[data-rekapinyu-session="active"] #auth-container{display:none!important;}
  #foto-sampul-toko{touch-action:none;}
</style>
<script id="rekapinyu-dashboard-session-gate">
(function(){
  const KEY="finance_active_session";
  function read(){
    try{
      const raw=localStorage.getItem(KEY);
      const data=raw?JSON.parse(raw):null;
      return data&&typeof data==="object"&&(data.uid||data.phone)?data:null;
    }catch(_){return null;}
  }
  function active(){return !!read();}
  function paint(){
    document.documentElement.dataset.rekapinyuSession=active()?"active":"guest";
  }
  function showDashboard(session){
    if(session){
      try{localStorage.setItem(KEY,JSON.stringify(session));}catch(_){}
    }
    document.documentElement.dataset.rekapinyuSession="active";
    document.getElementById("auth-container")?.classList.add("hidden");
  }
  function showLogin(){
    document.documentElement.dataset.rekapinyuSession="guest";
    document.getElementById("auth-container")?.classList.remove("hidden");
  }
  paint();
  window.__rekapinyuDashboardSession={read,active,paint,showDashboard,showLogin};
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAyzAV68m4BRtwmn0iu2vDplZaJ9r_uQVk",authDomain:"rekapinyu.firebaseapp.com",projectId:"rekapinyu",storageBucket:"rekapinyu.firebasestorage.app",messagingSenderId:"835450919713",appId:"1:835450919713:web:818f9f48c5b05330d67c60",measurementId:"G-4KSJC9ENH8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const phoneOf=v=>String(v??"").replace(/\D/g,""),emailOf=p=>`${phoneOf(p)}@rekapinyu.app`;
const sessionKey="finance_active_session";
const show=(title,msg)=>window.alert(`${title}\n\n${msg}`);
const goApp=()=>window.location.replace("https://rekapinyu.github.io/aplikasi");
function toggleAuthView(view){
  const l=document.getElementById("login-card"),r=document.getElementById("register-card");
  if(view==="register"){l?.classList.add("hidden");r?.classList.remove("hidden")}
  else{r?.classList.add("hidden");l?.classList.remove("hidden")}
}
window.toggleAuthView=toggleAuthView;

function saveSession(u){
  const data={uid:u.uid,name:u.name||"",shopName:u.shopName||"",phone:phoneOf(u.phone),email:u.email||"",password:u.password||"",role:u.role||"Pengguna"};
  localStorage.setItem(sessionKey,JSON.stringify(data));
}
async function loadProfile(user,p,password){
  try{
    const snap=await getDoc(doc(db,"Pengguna",user.uid));
    const d=snap.exists()?snap.data()||{}:{};
    return {uid:user.uid,name:String(d.NamaPengguna||user.displayName||""),shopName:String(d.NamaToko||d.shopName||d.storeName||d.tokoName||""),phone:phoneOf(d.NomorHp||p),email:user.email||"",password:String(d.Pasword||password),role:d.role||"Pengguna"};
  }catch(_){
    return {uid:user.uid,name:user.displayName||"",shopName:"",phone:p,email:user.email||"",password,role:"Pengguna"};
  }
}
async function ensureBase(user,p,name,password){
  const pr=doc(db,"Pengguna",user.uid),kr=doc(db,"Kasir",user.uid),rr=doc(db,"Rekap",user.uid);
  const [ps,ks,rs]=await Promise.all([getDoc(pr),getDoc(kr),getDoc(rr)]);
  if(!ps.exists())await setDoc(pr,{NamaPengguna:name,NomorHp:p,Pasword:password,role:"Pengguna"},{merge:true});
  if(!ks.exists())await setDoc(kr,{Aktifitas:[],NamaToko:name,NomorHp:p,Seting:{}},{merge:true});
  if(!rs.exists())await setDoc(rr,{BackupOtomatis:[],History:[],InputData:[],Kasbon:[],LaporanBulanan:[],NamaToko:name,NomorHp:p,Pengeluaran:[]},{merge:true});
}

document.getElementById("login-form")?.addEventListener("submit",async e=>{
 e.preventDefault(); const btn=e.submitter; if(btn)btn.disabled=true;
 try{
  await setPersistence(auth,browserLocalPersistence);
  const p=phoneOf(document.getElementById("login-phone")?.value||""),password=document.getElementById("login-password")?.value||"";
  if(!p||!password){show("Gagal Masuk","Nomor HP dan Kata Sandi wajib diisi.");return}
  const c=await signInWithEmailAndPassword(auth,emailOf(p),password);
  const d=await loadProfile(c.user,p,password); saveSession(d); goApp();
 }catch(err){
  const c=err?.code||"";
  show("Gagal Masuk",c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"?"Nomor HP atau Kata Sandi yang Anda masukkan salah.":c==="auth/network-request-failed"?"Koneksi ke Firebase gagal. Periksa internet lalu coba lagi.":"Login gagal. Periksa nomor HP, kata sandi, dan koneksi Firebase.");
 }finally{if(btn)btn.disabled=false}
});

document.getElementById("register-form")?.addEventListener("submit",async e=>{
 e.preventDefault(); const btn=e.submitter; if(btn)btn.disabled=true;
 try{
  await setPersistence(auth,browserLocalPersistence);
  const name=document.getElementById("reg-name")?.value.trim()||"",p=phoneOf(document.getElementById("reg-phone")?.value||""),password=document.getElementById("reg-password")?.value||"";
  if(!name||!p||password.length<6){show("Gagal Daftar",!name?"Nama wajib diisi.":!p?"Nomor HP wajib diisi.":"Kata sandi minimal 6 karakter.");return}
  const c=await createUserWithEmailAndPassword(auth,emailOf(p),password);
  await updateProfile(c.user,{displayName:name}); await ensureBase(c.user,p,name,password);
  await auth.signOut(); e.target.reset(); toggleAuthView("login"); show("Pendaftaran Berhasil","Akun berhasil dibuat. Silakan masuk menggunakan Nomor HP dan Kata Sandi.");
 }catch(err){
  const c=err?.code||""; show("Gagal Daftar",c==="auth/email-already-in-use"?"Nomor HP tersebut sudah terdaftar. Silakan langsung masuk.":c==="auth/weak-password"?"Kata sandi terlalu lemah. Gunakan minimal 6 karakter.":c==="auth/network-request-failed"?"Koneksi ke Firebase gagal. Periksa internet lalu coba lagi.":"Pendaftaran gagal. Periksa koneksi Firebase.");
 }finally{if(btn)btn.disabled=false}
});

/* LOGIN PAGE: tidak melakukan redirect otomatis berdasarkan sesi lama.
   /login tetap di /login sampai pengguna menekan tombol Masuk. */
</script>
